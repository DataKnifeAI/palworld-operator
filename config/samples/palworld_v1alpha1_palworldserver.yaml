apiVersion: palworld.dataknife.ai/v1alpha1
kind: PalworldServer
metadata:
  name: palworld-server
  namespace: game-servers
spec:
  # Official Pocketpair image (GHCR). Pin a version tag in lasting worlds
  # (stale node-cached :latest caused "incapable version" vs Steam 1.0.x clients).
  # Tags: https://github.com/pocketpairjp/palworld-dedicated-server-docker/pkgs/container/palserver
  serverImage: ghcr.io/pocketpairjp/palserver:v1.0.1.100619
  imagePullPolicy: IfNotPresent

  gateway:
    # Dedicated external IP (Kube-VIP / MetalLB), one per server.
    address: 192.168.14.187
    className: envoy

  serverName: DataKnife Palworld
  serverDescription: Operated by DataKnifeAI palworld-operator
  # Keep small for cluster nodes with ~8Gi allocatable.
  maxPlayers: 4
  multithreading: true

  gamePort: 8211
  queryPort: 27015

  rcon:
    enabled: true
    port: 25575

  restAPI:
    enabled: true
    port: 8212
    exposeViaGateway: false

  community:
    enabled: false

  updateOnBoot: true
  crossplayPlatforms: "(Steam,Xbox,PS5,Mac)"
  terminationGracePeriodSeconds: 60

  # Extra PalWorldSettings.ini OptionSettings (passthrough map).
  # Official key list: https://docs.palworldgame.com/settings-and-operation/configuration/
  # Merged into the ConfigMap INI and re-seeded onto the PVC every pod start.
  # Reserved keys (ServerName, passwords, ports, RCON/REST, CrossplayPlatforms)
  # come from the dedicated CR fields above and always override the map.
  # Do not put join/admin passwords here — use Secret refs / generateSecrets.
  # After patching, roll the game Deployment so seed-settings copies the INI
  # (world / PVC stay intact).
  #
  # optionSettings:
  #   bExistPlayerAfterLogout: "True"  # sleep in-place on logout
  #   WorkSpeedRate: "1.5"
  #   DeathPenalty: None               # None | Item | ItemAndEquipment | All
  #   # bAllowClientMod: "True"        # join policy only; does not install mods

  # Opt-in: auto-bump official Pocketpair image tags (default off).
  # Discovers latest vX.Y.Z.W via anonymous GHCR tag list; pins repo:tag (not :latest).
  # Learns DedicatedServerName from REST worldguid and seeds GameUserSettings.ini
  # so Recreate rolls keep the world. Prefer also setting dedicatedServerName explicitly.
  #
  # update:
  #   autoUpdateImage: true
  #   checkInterval: 6h                 # used when checkSchedule unset
  #   # checkSchedule: "0 */6 * * *"    # optional 5-field cron (timeZone)
  #   # applySchedule: "0 4 * * 1-5"    # optional maintenance window (cron must match now)
  #   timeZone: UTC                     # IANA; default UTC
  #   onlyWhenEmpty: true               # defer while REST currentplayernum > 0
  #   notifyPlayers: true               # REST POST /v1/api/announce before roll
  #   # notifySchedule: ["60m","30m","15m","5m","1m","30s","10s"]
  #   # notifyMessage: "[Server] Update {version} — restart in {remaining}"
  #   # notifyLeadTime: 2m              # deprecated single-stage fallback
  # dedicatedServerName: ""             # optional explicit world pin (SaveGames/0 folder)

  # Credentials — pick ONE mode:
  #
  # Mode A: bring-your-own Secret (create first, then reference keys):
  #   kubectl -n game-servers create secret generic palworld-server-secrets \
  #     --from-literal=admin-password='CHANGE_ME_ADMIN' \
  #     --from-literal=server-password='CHANGE_ME_JOIN'
  adminPasswordSecretRef:
    name: palworld-server-secrets
    key: admin-password
  serverPasswordSecretRef:
    name: palworld-server-secrets
    key: server-password
  #
  # Mode B: operator auto-generates an Opaque Secret ({metadata.name}-secrets)
  # with random server-password / admin-password. Omit the refs above and set:
  #   generateSecrets: true
  # Optional name override: credentialsSecretName: my-creds
  # Read passwords (never committed to git):
  #   kubectl get secret palworld-server-secrets -n game-servers \
  #     -o jsonpath='{.data.server-password}' | base64 -d; echo
  #   kubectl get secret palworld-server-secrets -n game-servers \
  #     -o jsonpath='{.data.admin-password}' | base64 -d; echo
  # Status surfaces credentialsSecretName / credentialsGenerated (no plaintext).

  storageSize: 50Gi
  storageClassName: truenas-csi-nfs

  # Dedicated mods PVC (default off). Enabling rolls the game pod — leave
  # commented on a live world. Do not enable on a lasting CR without a
  # maintenance window.
  # Official Pocketpair server mods are Windows-only:
  #   https://docs.palworldgame.com/settings-and-operation/mod/
  # This image is Linux PalServer — Workshop / PalModSettings.ini /
  # -workshopdir are not loaded. Live FS has no Mods/; saves PVC is
  # /pal/Package/Pal/Saved only.
  # Native Linux community PAK drops (not UE4SS / Win64 DLL injection):
  #   https://yorkhost.fr/docs/en/palworld/mods-ue4ss
  # Client mods: optionSettings.bAllowClientMod is join policy only.
  # Crossplay: consoles cannot load PC client mods; server content mods
  # can lock consoles out.
  # Mounts /pal/Package/Mods (forward-looking Pocketpair path) plus
  # Paks/~WorkshopMods and Paks/LogicMods overlays (does not replace
  # Pal/Content/Paks or hide Pal-LinuxServer.pak).
  # Back up saves and pin serverImage before adding PAKs.
  #
  # mods:
  #   enabled: true
  #   storage:
  #     size: 10Gi
  #     # storageClassName: truenas-csi-nfs  # defaults to spec.storageClassName
  #   # path: /pal/Package/Mods
  #   # workshopDir: /pal/Package/Mods/Workshop
  #   # useWorkshopDirArg: false             # Linux PalServer.sh does not pass this
  #   # paksOverlay: true                    # default; false = Mods/ only
  #   # activeModList:                       # optional PalModSettings.ini seed
  #   #   - GamingCattiva

  # Optional HTTP mod manager on the Gateway VIP (same IP as game UDP).
  # Requires mods.enabled. Enabling rolls the game pod (Recreate) — leave
  # commented on a live world. Basic auth: user "admin" + admin-password
  # Secret key. REST/RCON stay ClusterIP-internal.
  # Sidecar binary is /mod-manager from the operator image — rebuild/push
  # harbor.dataknife.net/library/palworld-operator after this feature lands.
  # Linux PalServer still does not load official Workshop packages; use
  # paks/~WorkshopMods and paks/LogicMods for community .pak drops.
  # Restart button Recreate-rolls the Deployment (players disconnect).
  #
  # modManager:
  #   enabled: true
  #   port: 8088
  #   # image: harbor.dataknife.net/library/palworld-operator:latest

  # Explicit modest resources for ~8Gi worker nodes.
  resources:
    requests:
      cpu: "1"
      memory: 3Gi
    limits:
      cpu: "4"
      memory: 6Gi

  nodeSelector:
    kubernetes.io/os: linux
    kubernetes.io/arch: amd64
